name: Цены Краснодар — обновление и публикация
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Прочитать источники заново
        type: boolean
        default: true
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: write
  pages: write
  issues: write
concurrency:
  group: price-report
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - name: Прочитать цены
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: npm run refresh
      - run: npm run check
      - run: npm run build
      - name: Сохранить историю и готовую страницу
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Обновление отчета и готовой страницы [skip ci]"
            git push
          fi
      - name: Опубликовать GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/request-pages-build.mjs
      - name: Уведомление об изменениях и сбоях
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify.mjs
